name: Playwright Tests

# De momento solo se lanza a mano desde la pestaña "Actions" de GitHub.
# Para ejecutarse en cada push necesita MongoDB, el backend arrancado y el catálogo de ejercicios
# (se hará en la iteración de integración continua).
on:
  workflow_dispatch:
  push:
    branches: [ test-e2e ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install frontend dependencies
      run: npm ci --prefix client
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30