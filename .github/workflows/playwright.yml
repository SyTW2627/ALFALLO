name: CI · Tests E2E (Playwright)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Instalar dependencias (raíz, servidor y cliente)
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      # La API usa config/dev.env y el frontend apunta a ella con client/.env
      - name: Configurar el entorno de pruebas
        run: |
          mkdir -p server/config
          cat > server/config/dev.env <<EOF
          PORT=3000
          MONGODB_URL=mongodb://127.0.0.1:27017/alfallo-e2e
          JWT_SECRET=ci-secret-solo-para-tests
          ADMIN_PASSWORD=ci-admin-solo-para-tests
          EOF
          echo "PUBLIC_API_URL=http://localhost:3000/api" > client/.env

      - name: Cargar el catálogo de ejercicios
        run: npm run seed --prefix server

      # Se arranca en segundo plano y se espera a que /api/health responda
      - name: Arrancar la API
        working-directory: server
        run: |
          nohup npx env-cmd -f ./config/dev.env tsx src/index.ts > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API lista"
              exit 0
            fi
            sleep 2
          done
          echo "La API no ha arrancado:"
          cat ../api.log
          exit 1

      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      # Playwright arranca el frontend él solo (webServer en playwright.config.ts)
      - name: Ejecutar los tests E2E
        run: npm run test:e2e

      - name: Log de la API (si algo falla)
        if: failure()
        run: cat api.log 2>/dev/null || echo "La API no llegó a arrancar"

      - name: Guardar el informe de Playwright
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14